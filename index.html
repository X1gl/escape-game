<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#111827">
  <title>ESCAPE PROTOTYPE</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main id="app" aria-live="polite">
    <section id="loading" class="screen center"><p>LOADING…</p></section>

    <section id="title" class="screen title-bg hidden">
      <div class="title-card">
        <p class="eyebrow">MOBILE ESCAPE GAME</p>
        <h1>ESCAPE<br>PROTOTYPE</h1>
        <div class="title-actions">
          <button id="new-game" class="primary">はじめから</button>
          <button id="continue-game">つづきから</button>
        </div>
      </div>
    </section>

    <section id="novel" class="screen novel-bg hidden" tabindex="0" aria-label="会話を進める">
      <div id="novel-scene-label" class="scene-label"></div>
      <div class="character" aria-hidden="true"><div class="head"></div><div class="body"></div></div>
      <div class="dialogue">
        <strong id="speaker"></strong>
        <p id="dialogue-text"></p>
        <span class="next-mark">▼ TAP</span>
      </div>
    </section>

    <section id="escape" class="screen escape-screen hidden">
      <header class="game-header"><span>ROOM 01</span><strong id="direction-label">FRONT</strong><button id="to-title" class="small">TITLE</button></header>
      <div id="room-view" class="room-view">
        <div id="room-art" class="room-art" aria-label="部屋の調査画面"></div>
        <div id="hotspots"></div>
        <button id="turn-left" class="turn left" aria-label="左を向く">‹</button>
        <button id="turn-right" class="turn right" aria-label="右を向く">›</button>
      </div>
      <div class="escape-ui">
        <div id="message" class="message">部屋を調べよう。</div>
        <div class="inventory-wrap"><span class="inventory-label">ITEM</span><div id="inventory" class="inventory"></div></div>
      </div>
    </section>

    <section id="end" class="screen end-bg center hidden"><p class="eyebrow">ESCAPE COMPLETE</p><h2>END</h2><button id="end-title">タイトルへ</button></section>
  </main>

  <div id="keypad-modal" class="modal hidden" role="dialog" aria-modal="true" aria-label="テンキー">
    <div class="modal-card keypad-card"><h2>KEYPAD</h2><output id="keypad-display">---</output><div id="keypad-buttons" class="keypad"></div><button id="keypad-close">閉じる</button></div>
  </div>
  <div id="item-modal" class="modal hidden" role="dialog" aria-modal="true" aria-label="アイテム詳細">
    <div class="modal-card item-card"><button id="item-close" class="modal-close" aria-label="閉じる">×</button><div id="item-visual"></div><h2 id="item-name"></h2><p id="item-description"></p></div>
  </div>
  <script type="module" src="./js/game.js"></script>
</body>
</html>
